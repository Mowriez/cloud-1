- name: Provision Azure Infrastructure
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run Provisioning Tasks
      import_role:
        name: azure_infra
        tasks_from: main.yml
      tags: 
        - provision

- name: Teardown Azure Infrastructure
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run Teardown Tasks
      import_role:
        name: azure_infra
        tasks_from: teardown.yml
      tags:
        - teardown

#TODO: Fix tags so empty tags don't cause issues with ansible-playbook command. Currently, if you run ansible-playbook with --tags provision, it will run both the provision and teardown tasks because the teardown tasks have an empty tags list.