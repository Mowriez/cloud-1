- name: Provision Azure Infrastructure
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run Provisioning Tasks
      import_role:
        name: azure_infra
        tasks_from: main.yml
      tags: 
        - provision

- name: Destroy Azure Infrastructure
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Run Destruction Tasks
      import_role:
        name: azure_infra
        tasks_from: destroy.yml
      tags:
        - destroy